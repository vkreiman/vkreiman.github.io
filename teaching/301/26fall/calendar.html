<script>
  // Steps 1 and 2 retrieve calendar today color from css variable.
  // 1. Get the computed styles of the root element
  const rootStyles = window.getComputedStyle(document.documentElement);

  // 2. Fetch the specific variable value
  const todayCalCol = rootStyles.getPropertyValue('--today-cal-color').trim();

  function isSameDay(date1, date2) {
      // Compare year, month, and day
      return date1.getFullYear() === date2.getFullYear() && date1.getMonth() ===
          date2.getMonth() && date1.getDate() === date2.getDate();
  }

  const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
		  "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  tds = document.getElementsByTagName("td");
  let classDay = new Date("August 31, 2026");
  let currentDate = new Date();

  for (let i = 0; i < tds.length; i++) {

      a = months[classDay.getMonth()] + " " +
          classDay.getDate();
      tds[i].insertAdjacentHTML("afterbegin",
				`<div class='caldate'>${a}</div>`);

      if (isSameDay(currentDate, classDay)) {
          tds[i].style.backgroundColor = todayCalCol; }


      if ((i + 1) % 5 == 0) {
          classDay.setDate(classDay.getDate() + 3); } else {
              classDay.setDate(classDay.getDate() + 1); }
  }
  
  </script>
